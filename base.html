<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>

</head>
<body>
    <div id="container">
        <div class="first-div" id="display"> </div>
        <div id="touchpad" class="first-div">
        <div class="touchpad-div" id="Numbers" >
            <div class="num-row" id="one-two">
                <button class="Number" id="one">1</button>
                <button  class="Number" id="two">2</button>
            </div>
            <div class ="num-row" id="three-four">
                <button class="Number" id="three">3</button>
                <button  class="Number" id="four">4</button>
            </div>
            <div class ="num-row" id="five-six">
                <button class="Number" id="five">5</button>
                <button  class="Number" id="six">6</button>
            </div>
            <div class ="num-row" id="seven-eight">
                <button class="Number" id="seven">7</button>
                <button  class="Number" id="eight">8</button>
            </div>
            <div class ="num-row" id="nine-zero">
                <button class="Number" id="nine">9</button>
                <button  class="Number" id="zero">0</button>
            </div>
        </div>
        <div class="touchpad-div" id="operators">
            <div class ="operator-row" id="clear-back">
                <button class="function" id="clear">Clear</button>
                <button  class="function" id="back">Backspace</button>
            </div>
            <div class ="operator-row" id="add-sub">
                <button class="operator" id="add">+</button>
                <button  class="operator" id="subtract">-</button>
            </div>
            <div class ="operator-row" id="multiply-div">
                <button class="operator" id="multiply">x</button>
                <button  class="operator" id="divide">/</button>
            </div>
            <div class ="operator-row" id="equals">
                <button class="function" id="eq">=</button>
            </div>


        </div>
        </div>

    </div>




</body>
</html>
